# Publishes the Python SDK (distribution `surpradhan-aep`, import package `aep`,
# in sdks/python/) to PyPI when a `python-sdk-v*` tag is pushed.
#
# This is a *release* workflow only — it never runs on push to a branch and
# never runs on pull requests. It is NOT a required PR status check, so the
# `.github/scripts/check_required_checks.py` drift-guard does NOT need to
# (and must not) list these jobs. PR-time test coverage for the Python SDK is
# already provided by the Python jobs in ci.yml.
#
# ── Distribution vs import name ──────────────────────────────────────────────
# The PyPI *distribution* name is `surpradhan-aep` (the bare `aep` name was
# already taken on PyPI); the *import* name stays `aep` (`import aep`). Users
# `pip install surpradhan-aep` then `import aep`. See sdks/python/pyproject.toml.
#
# ── Why two jobs ────────────────────────────────────────────────────────────
# `main` is PR-protected (review + green CI before merge), but *tags* are not —
# anyone with write access can push a `python-sdk-v*` tag at any commit, including
# one that never landed on `main`. Trusted Publishing (OIDC) attests *what source*
# a release came from but does not stop a tag being cut from unreviewed code. So
# the publish is gated twice, independently:
#
#   verify  → fails fast (before any approval is requested) unless the tagged
#             commit is an ancestor of origin/main, i.e. it was merged via PR.
#             Also builds (sdist + wheel) + tests, so the approver sees a green
#             pre-flight.
#   publish → runs in the `pypi-publish` Environment, which has required
#             reviewers. The actual upload to PyPI only happens after a human
#             approves the deployment — enforced by Actions itself, independent
#             of who pushed the tag.
#
# ── Maintainer setup (one-time — cannot be done from code) ───────────────────
# 1. Configure a PyPI Trusted Publisher for this project (no API token needed).
#    On PyPI → Account → Publishing (or the project's "Publishing" settings for
#    an existing project), add a GitHub Actions trusted publisher with EXACTLY:
#        PyPI Project Name:  surpradhan-aep
#        Owner:              surpradhan
#        Repository:         agent-event-protocol
#        Workflow filename:  release-python-sdk.yml
#        Environment name:   pypi-publish
#    For the very first release the project does not exist on PyPI yet — use
#    PyPI's "pending publisher" flow (Account → Publishing → Add a pending
#    publisher) with the same five values; PyPI creates the project on first
#    successful upload.
# 2. Create a deployment Environment named `pypi-publish`
#    (Settings → Environments → New environment) and add yourself / the release
#    owners under **Required reviewers**. Optionally restrict it to
#    `python-sdk-v*` tags via the environment's deployment-branch/tag rules.
#    No secrets are stored on the environment — OIDC replaces the API token.
#
# ── Cutting a release ───────────────────────────────────────────────────────
# 1. Bump `sdks/python/pyproject.toml` `version` AND `aep/__init__.py`
#    `__version__` (keep them in sync) on a PR; squash-merge to main.
# 2. From main, tag the release commit and push the tag:
#        git tag python-sdk-v0.3.0
#        git push origin python-sdk-v0.3.0
# 3. `verify` runs immediately. If the tag is on merged main and build+test pass,
#    a deployment to `pypi-publish` is requested — approve it in the Actions UI
#    to let `publish` upload the verified artifacts to PyPI via Trusted
#    Publishing (OIDC). The published artifacts are the exact sdist + wheel built
#    by `verify` (downloaded as an artifact), so what is tested is what ships.
#
# Trusted Publishing requires `id-token: write` (OIDC) on the publish job so the
# upload action can exchange a GitHub OIDC token for a short-lived PyPI token —
# there is NO long-lived API token to store or leak.

name: Release Python SDK

on:
  push:
    tags:
      - 'python-sdk-v*'

# Serialize releases: never let two tag pushes publish at the same time. A
# stable group (not per-tag) means any in-flight release blocks the next one
# rather than racing it; we never cancel a publish that may already be partway
# through, so cancel-in-progress stays false.
concurrency:
  group: release-python-sdk
  cancel-in-progress: false

jobs:
  # Pre-flight: cheap guardrails that run *before* the approval gate, so a
  # mis-cut tag is rejected without ever pausing a reviewer. Also builds the
  # sdist + wheel and uploads them so the publish job ships the exact, tested
  # artifacts.
  verify:
    name: Verify release tag (ancestry + build + test)
    runs-on: ubuntu-latest

    # Least-privilege: this job only checks out, builds, tests, and uploads an
    # artifact — it needs no write scopes and (unlike publish) no OIDC token.
    permissions:
      contents: read

    steps:
      # Actions are pinned to immutable commit SHAs (not floating tags)
      # throughout this release workflow; bump the SHA + comment together on
      # upgrade. See the publish job for why pinning matters most there.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Full history so the ancestry check can resolve origin/main; a
          # shallow checkout would not contain main's commits.
          fetch-depth: 0

      - name: Verify tag points at a commit merged to main
        # The tagged commit must be reachable from origin/main — i.e. it landed
        # on main through the PR-protected merge path. This rejects tags cut from
        # unreviewed or off-main commits before any publish/approval happens.
        run: |
          git fetch --quiet --no-tags origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "✓ $GITHUB_SHA is an ancestor of origin/main — tag cut from reviewed, merged code."
          else
            echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not an ancestor of origin/main."
            echo "::error::Releases must be cut from commits merged to main via PR. Refusing to publish."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'

      - name: Install build + test dependencies
        working-directory: sdks/python
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install -e ".[dev]"

      - name: Build sdist + wheel
        working-directory: sdks/python
        run: python -m build

      - name: Run tests
        # Unit tests run without a server; integration tests auto-skip when no
        # AEP server is reachable — same as the PR-time Python jobs in ci.yml.
        working-directory: sdks/python
        run: python -m pytest tests -q

      - name: Upload built distributions
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: python-dist
          path: sdks/python/dist/
          if-no-files-found: error

  # Gated publish: only runs after `verify` is green AND a required reviewer
  # approves the deployment to the `pypi-publish` environment. Uploads via PyPI
  # Trusted Publishing (OIDC) — there is no API token to store.
  publish:
    name: Publish surpradhan-aep to PyPI
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi-publish

    permissions:
      contents: read
      # Required for Trusted Publishing: lets the upload action mint a
      # short-lived OIDC token PyPI exchanges for an upload credential.
      id-token: write

    steps:
      # Download the EXACT artifacts that `verify` built and tested — we do not
      # rebuild here, so what shipped is what was verified.
      - name: Download built distributions
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: python-dist
          path: dist/

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        # Pinned to an immutable commit SHA (not a floating tag): this job path
        # holds id-token: write, so a hijacked action tag must not be able to
        # inject into it. Bump the SHA + comment together on upgrade.
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
        with:
          packages-dir: dist/
