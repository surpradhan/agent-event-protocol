name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  operator-test:
    name: Operator unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operator
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: operator/go.sum

      - name: Download dependencies
        run: go mod tidy

      - name: Run operator unit tests
        run: go test $(go list ./... | grep -v /tests) -v -count=1

  go-sdk-test:
    name: Go SDK unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/go
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: sdks/go/go.sum

      - name: Download dependencies
        run: go mod tidy

      - name: Vet (incl. integration build tag)
        run: |
          go vet ./...
          go vet -tags integration ./...

      - name: Run Go SDK unit tests
        # Integration tests are gated behind the `integration` build tag and a
        # live server, so they are excluded from this server-less CI run.
        run: go test ./... -count=1

  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm test

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Verify build
        run: |
          node src/server.js &
          sleep 2
          curl -f http://localhost:8787/health || exit 1

  docker:
    runs-on: ubuntu-latest
    needs: test

    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t agent-event-protocol:latest .

      - name: Verify Docker image
        run: docker images | grep agent-event-protocol
