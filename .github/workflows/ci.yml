name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  operator-test:
    name: Operator unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operator
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: operator/go.sum

      - name: Download dependencies
        run: go mod tidy

      - name: Run operator unit tests
        run: go test $(go list ./... | grep -v /tests) -v -count=1

  go-sdk-test:
    name: Go SDK unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/go
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: sdks/go/go.sum

      - name: Download dependencies
        run: go mod tidy

      - name: Vet (incl. integration build tag)
        run: |
          go vet ./...
          go vet -tags integration ./...

      - name: Run Go SDK unit tests
        # Integration tests are gated behind the `integration` build tag and a
        # live server, so they are excluded from this server-less CI run.
        run: go test ./... -count=1

  otelbridge-test:
    name: otelbridge unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: otelbridge
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: otelbridge/go.sum

      # Resolves the OTEL Collector deps and the local AEP SDK
      # (replace github.com/surpradhan/aep-go => ../sdks/go).
      - name: Download dependencies
        run: go mod tidy

      - name: Build and vet
        run: |
          go build ./...
          go vet ./...
          go vet -tags integration ./...   # keep the tag-gated integration test compiling

      - name: Run otelbridge unit tests
        # The live-server integration test is gated behind the `integration`
        # build tag and is excluded from this server-less CI run.
        run: go test ./... -count=1

  python-sdk-test:
    name: Python SDK tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the Python SDK (with dev + langgraph + crewai + autogen + openai-agents + claude-agent + otel extras)
        # otel is needed so the full suite (incl. the Phase 11 aep.otel tests)
        # can import opentelemetry; langgraph + crewai + autogen + openai-agents +
        # claude-agent cover the framework auto-instrumentation tests (Phase 12b
        # LangGraph, 12c CrewAI, 12d AutoGen, 12e OpenAI Agents SDK, 12f Claude Agent SDK).
        run: pip install -e "sdks/python[dev,langgraph,crewai,autogen,openai-agents,claude-agent,otel]"

      - name: Lint the SDK package
        run: |
          pip install ruff
          ruff check sdks/python/aep

      - name: Run Python SDK tests
        # Integration tests auto-skip when no AEP server is reachable
        # (tests/integration/conftest.py). Unit tests cover the instrumentation
        # handler, including the LangGraph callback mapping.
        run: pytest sdks/python/tests -v

  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm test

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Verify build
        run: |
          node src/server.js &
          sleep 2
          curl -f http://localhost:8787/health || exit 1

  docker:
    runs-on: ubuntu-latest
    needs: test

    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t agent-event-protocol:latest .

      - name: Verify Docker image
        run: docker images | grep agent-event-protocol

  check-sync:
    name: Required checks in sync
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      # Verifies the CI job contexts, the CONTRIBUTING.md required-checks block,
      # and (when CHECKS_SYNC_TOKEN is set) the live branch-protection list all
      # agree. CHECKS_SYNC_TOKEN is optional: the default GITHUB_TOKEN cannot
      # read branch protection, so without an admin PAT only the workflow<->docs
      # comparison runs (which is the part that matters most and works on forks).
      - name: Verify required checks are in sync
        env:
          CHECKS_SYNC_TOKEN: ${{ secrets.CHECKS_SYNC_TOKEN }}
        run: python3 .github/scripts/check_required_checks.py
