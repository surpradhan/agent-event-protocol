---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aep-operator
  namespace: aep-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: operator-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: operator-role
subjects:
  - kind: ServiceAccount
    name: aep-operator
    namespace: aep-system
