---
# Hand-authored — equivalent to `make manifests` output from +kubebuilder:rbac markers.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: operator-role
rules:
  # AgentInstrumentation CRD management
  - apiGroups: [aep.dev]
    resources: [agentinstrumentations]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [aep.dev]
    resources: [agentinstrumentations/status]
    verbs: [get, update, patch]
  - apiGroups: [aep.dev]
    resources: [agentinstrumentations/finalizers]
    verbs: [update]
  # Namespace + Pod reads for injectedCount reconciliation
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  # Leader election (required when --leader-elect=true)
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  # Kubernetes Event emission
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
