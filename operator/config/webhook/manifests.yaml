---
# Hand-authored — equivalent to `make manifests` output from +kubebuilder:webhook marker.
# TLS cert injection is handled by cert-manager (see service.yaml for Certificate + Issuer).
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: aep-mutating-webhook-configuration
  annotations:
    # cert-manager injects the CA bundle into this field automatically.
    cert-manager.io/inject-ca-from: aep-system/aep-operator-serving-cert
spec:
  webhooks:
    - name: mpod.aep.dev
      admissionReviewVersions: [v1]
      clientConfig:
        service:
          name: aep-operator-webhook-service
          namespace: aep-system
          path: /mutate-core-v1-pod
      rules:
        - apiGroups: [""]
          apiVersions: [v1]
          operations: [CREATE]
          resources: [pods]
          scope: Namespaced
      # Ignore: pods still start if the webhook is unavailable.
      failurePolicy: Ignore
      sideEffects: None
      # NOTE: objectSelector is intentionally absent.
      # The opt-in mechanism uses the aep.dev/inject ANNOTATION, not a label.
      # objectSelector only matches labels, so adding it here would silently
      # block all injection. The Handle() function gates injection on the
      # annotation instead, which means all pod creates are routed here — the
      # first check in Handle() is a fast no-op for unannotated pods.
