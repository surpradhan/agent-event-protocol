{{- if and .Values.webhook.enabled .Values.webhook.certManager.enabled }}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "aep-operator.fullname" . }}-selfsigned-issuer
  namespace: {{ include "aep-operator.namespace" . }}
  labels:
    {{- include "aep-operator.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "aep-operator.fullname" . }}-serving-cert
  namespace: {{ include "aep-operator.namespace" . }}
  labels:
    {{- include "aep-operator.labels" . | nindent 4 }}
spec:
  dnsNames:
    - {{ include "aep-operator.webhookServiceName" . }}.{{ include "aep-operator.namespace" . }}.svc
    - {{ include "aep-operator.webhookServiceName" . }}.{{ include "aep-operator.namespace" . }}.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: {{ include "aep-operator.fullname" . }}-selfsigned-issuer
  secretName: {{ include "aep-operator.webhookCertSecret" . }}
{{- end }}
