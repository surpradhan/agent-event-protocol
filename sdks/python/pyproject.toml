[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name (PyPI) ≠ import name. The import package stays `aep`
# (`import aep`), but the PyPI distribution is `agent-event-protocol` because the
# bare `aep` name is already taken on PyPI. The distribution name matches the
# project's full name and GitHub repo (single, consistent identity everywhere).
# Install with `pip install agent-event-protocol`; import with `import aep`.
name = "agent-event-protocol"
version = "0.3.0"
description = "Python SDK for the Agent Event Protocol (AEP) — structured observability for multi-agent AI systems"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Surabhi Pradhan", email = "surabhi7pradhan@gmail.com" },
]
keywords = [
    "agent",
    "observability",
    "telemetry",
    "tracing",
    "llm",
    "multi-agent",
    "opentelemetry",
    "langgraph",
    "crewai",
    "autogen",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1.0",
    "jsonschema>=4.20,<5.0",
]

[project.urls]
Homepage = "https://github.com/surpradhan/agent-event-protocol"
Repository = "https://github.com/surpradhan/agent-event-protocol"
Issues = "https://github.com/surpradhan/agent-event-protocol/issues"
Changelog = "https://github.com/surpradhan/agent-event-protocol/blob/main/CHANGELOG.md"
"Source (Python SDK)" = "https://github.com/surpradhan/agent-event-protocol/tree/main/sdks/python"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]
langgraph = [
    "langgraph>=0.1.0",
    # langgraph pulls in langchain-core; pin it so the callback handler the
    # instrumentation registers is always importable.
    "langchain-core>=0.1.0",
]
crewai = [
    # CrewAI publishes its event bus under crewai.events (the supported
    # extension point the CrewAI instrumentor subscribes to); the >=1.0 floor
    # matches MIN_CREWAI_VERSION in aep/instrument.py.
    "crewai>=1.0.0",
]
autogen = [
    # AutoGen AgentChat's typed run_stream event model (ToolCallRequestEvent /
    # ToolCallExecutionEvent) the tracer maps landed in the 0.4 rewrite; the
    # >=0.4 floor matches MIN_AUTOGEN_VERSION in aep/instrument.py. The offline
    # demo + tool integration test use autogen-ext's ReplayChatCompletionClient.
    "autogen-agentchat>=0.4",
    "autogen-ext>=0.4",
]
openai-agents = [
    # The OpenAI Agents SDK's tracing-processor model (add_trace_processor +
    # agent/function/handoff span-data types) the tracer maps; the >=0.1 floor
    # matches MIN_OPENAI_AGENTS_VERSION in aep/instrument.py. The offline demo +
    # integration tests drive Runner.run with a scripted Model (no API key).
    "openai-agents>=0.1",
]
claude-agent = [
    # The Claude Agent SDK's hooks model (ClaudeAgentOptions.hooks + the
    # SubagentStart/SubagentStop/PreToolUse/PostToolUse/PostToolUseFailure/Stop
    # hook events) the tracer injects; the >=0.2 floor matches
    # MIN_CLAUDE_AGENT_VERSION in aep/instrument.py. The offline demo + hermetic
    # integration test drive a real query() through a control-protocol fake
    # transport (no API key, no claude binary).
    "claude-agent-sdk>=0.2",
]
otel = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aep*"]

[tool.setuptools.package-data]
aep = ["py.typed", "schemas/*.json", "schemas/payloads/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint]
# AEP field names (type, id, format) intentionally match Python builtins to
# mirror the JS SDK and JSON schema property names. Suppress A002 globally.
ignore = ["A002"]
