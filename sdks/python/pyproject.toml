[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aep"
version = "0.2.0"
description = "Python SDK for the Agent Event Protocol"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1.0",
    "jsonschema>=4.20,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]
langgraph = [
    "langgraph>=0.1.0",
    # langgraph pulls in langchain-core; pin it so the callback handler the
    # instrumentation registers is always importable.
    "langchain-core>=0.1.0",
]
crewai = [
    # CrewAI publishes its event bus under crewai.events (the supported
    # extension point the CrewAI instrumentor subscribes to); the >=1.0 floor
    # matches MIN_CREWAI_VERSION in aep/instrument.py.
    "crewai>=1.0.0",
]
autogen = [
    # AutoGen AgentChat's typed run_stream event model (ToolCallRequestEvent /
    # ToolCallExecutionEvent) the tracer maps landed in the 0.4 rewrite; the
    # >=0.4 floor matches MIN_AUTOGEN_VERSION in aep/instrument.py. The offline
    # demo + tool integration test use autogen-ext's ReplayChatCompletionClient.
    "autogen-agentchat>=0.4",
    "autogen-ext>=0.4",
]
otel = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aep*"]

[tool.setuptools.package-data]
aep = ["py.typed", "schemas/*.json", "schemas/payloads/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint]
# AEP field names (type, id, format) intentionally match Python builtins to
# mirror the JS SDK and JSON schema property names. Suppress A002 globally.
ignore = ["A002"]
