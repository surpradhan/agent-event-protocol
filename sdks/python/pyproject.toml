[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aep"
version = "0.2.0"
description = "Python SDK for the Agent Event Protocol"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1.0",
    "jsonschema>=4.20,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aep*"]

[tool.setuptools.package-data]
aep = ["py.typed", "schemas/*.json", "schemas/payloads/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint]
# AEP field names (type, id, format) intentionally match Python builtins to
# mirror the JS SDK and JSON schema property names. Suppress A002 globally.
ignore = ["A002"]
